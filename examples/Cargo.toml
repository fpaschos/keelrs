[workspace]
members = ["*"]
exclude = ["target"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "=1.0.104"
keelrs = { path = "../keelrs" }
tokio = "=1.54.1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
