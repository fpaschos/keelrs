[workspace]
members = ["*"]
exclude = ["target"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "=1.0.104"
keelrs = { path = "../keelrs" }
reqwest = "=0.13.5"
rig-core = "=0.46.0-rc.1"
rig-tools = "=0.46.0-rc.1"
schemars = "=1.2.3"
serde = "=1.0.229"
tokio = "=1.54.1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
