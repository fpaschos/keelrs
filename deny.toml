# One config for both workspaces: cargo-deny walks up from the cwd to find it.

[graph]
all-features = true

[advisories]
# defaults: vulnerabilities and unsound (direct) fail, yanked warns, unmaintained = "all"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8
exceptions = [
  { crate = "notify", allow = ["CC0-1.0"] }, # via rig-tools, in keelrs::sandbox::local
]

[licenses.private]
ignore = true # examples are publish = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # examples' path dependency on keelrs

[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
